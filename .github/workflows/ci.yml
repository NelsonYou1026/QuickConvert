name: Build and test
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install developer build tools
        run: brew install pkgconf
      - uses: actions/cache@v4
        with:
          path: |
            build/engine-downloads
            build/engines
            vendor/engines
          key: conversion-engines-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('distribution/engines.lock.json', 'scripts/prepare_engines.py') }}
      - name: Build self-contained architecture-specific application and DMG
        run: bash scripts/package.sh '${{ matrix.arch }}'
      - name: Core and bundled conversion tests
        run: QUICKCONVERT_TEST_BUNDLE="$PWD/build/${{ matrix.arch }}/Build/Products/Release/QuickConvert.app" swift test
      - name: Relocated app with system-only PATH
        run: python3 scripts/smoke_bundle.py build/${{ matrix.arch }}/Build/Products/Release/QuickConvert.app
      - name: Verify exact architecture
        run: |
          python3 scripts/verify_bundle.py build/${{ matrix.arch }}/Build/Products/Release/QuickConvert.app --architecture '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        with:
          name: QuickConvert-${{ matrix.arch }}-local-preview
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          compression-level: 0
